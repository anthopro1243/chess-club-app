<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Club</title>
    <link rel="icon" type="image/png" href="./sem-logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <!-- Members-only club app used by minors: keep every page out of search engines (research F121). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Chess club — play, roster, and training." />
    <!-- Apply the saved theme before the first paint, so light-theme users don't see a dark flash.
         The fonts (Oswald, Public Sans) are bundled from npm, not loaded from Google. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('cc-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          var hosted = document.documentElement.getAttribute('data-theme');
          theme =
            hosted === 'light' || hosted === 'dark'
              ? hosted
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
